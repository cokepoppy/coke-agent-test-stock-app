<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Coke Agent · 证券交易</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#20242b;background:#f4f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;max-width:480px;min-height:100vh;margin-inline:auto;background:#f7f8fa}.app{padding:0 16px 40px}.top{height:54px;display:flex;align-items:center;justify-content:space-between;color:#20242b}.brand{font-size:17px;font-weight:700;letter-spacing:.2px}.avatar{width:30px;height:30px;border-radius:50%;background:#d9e8ff;color:#2463b5;display:grid;place-items:center;font-size:12px;font-weight:700}.tabs{display:flex;gap:22px;border-bottom:1px solid #e5e8ed;color:#8b929e;font-size:14px}.tabs span{padding:11px 0}.tabs .active{color:#1f5fbf;border-bottom:2px solid #286dd1;font-weight:600}.quote{background:white;padding:14px 16px;margin:14px 0;border-radius:12px;border:1px solid #edf0f3}.security{font-weight:650;font-size:17px}.ticker{font-size:12px;color:#9299a4;margin-top:5px}.price-row{display:flex;align-items:baseline;gap:8px;margin-top:13px}.price{font-size:24px;color:#e74e58;font-weight:700}.change{font-size:12px;color:#e74e58}.market{font-size:11px;color:#707a88;margin-top:7px}.panel{background:white;border:1px solid #edf0f3;border-radius:12px;padding:16px;margin-top:14px}.panel-title{font-size:15px;font-weight:650;margin-bottom:14px}.field{margin:13px 0}.field label{display:block;color:#6f7784;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;height:44px;border:1px solid #dce1e8;border-radius:8px;background:#fff;padding:0 12px;font-size:16px;color:#20242b;outline:none}.field input:focus,.field select:focus{border-color:#4384df;box-shadow:0 0 0 3px #e7f0ff}.hint{font-size:11px;color:#929aa5;line-height:1.6}.summary{border-top:1px solid #eef0f3;margin-top:15px;padding-top:12px;display:flex;justify-content:space-between;font-size:12px;color:#7f8793}.submit{width:100%;height:48px;border:0;border-radius:9px;background:#246bd1;color:white;font-size:16px;font-weight:650;margin-top:18px}.submit:active{background:#1558b9}.notice{display:none;margin-top:12px;padding:11px 12px;border-radius:8px;font-size:13px;line-height:1.5}.notice.error{display:block;color:#a62d35;background:#fff0f0;border:1px solid #ffd5d7}.notice.ok{display:block;color:#1c754a;background:#eaf8f0;border:1px solid #c6ecd7}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:25px;background:#fff;border-top:1px solid #edf0f3;color:#a0a6b0;text-align:center;font-size:10px;padding-top:6px}
  </style>
</head>
<body>
  <div class="app">
    <header class="top"><div class="brand">Coke Agent · 证券交易</div><div class="avatar">可</div></header>
    <nav class="tabs"><span>行情</span><span class="active">交易</span><span>持仓</span><span>资产</span></nav>
    <section class="quote" aria-label="证券行情">
      <div class="security">星禾科技 <span style="font-size:12px;color:#8c95a2;font-weight:500">835368</span></div>
      <div class="ticker">北交所 · 大宗交易</div>
      <div class="price-row"><div class="price">18.74</div><div class="change">+0.38&nbsp; +2.07%</div></div>
      <div class="market">成交均价 18.36　最高成交 19.12　最低成交 17.90</div>
    </section>
    <section class="panel">
      <div class="panel-title">大宗交易委托</div>
      <div class="field"><label for="side">买卖方向</label><select id="side"><option>买入</option><option>卖出</option></select></div>
      <div class="field"><label for="price">委托价格（元）</label><input id="price" inputmode="decimal" value="19.50" aria-describedby="priceHint"></div>
      <div class="hint" id="priceHint">申报价格需符合交易规则。当前行情：成交均价 18.36 元。</div>
      <div class="field"><label for="quantity">委托数量（股）</label><input id="quantity" inputmode="numeric" value="10000"></div>
      <div class="summary"><span>预计金额</span><strong id="amount">¥195,000.00</strong></div>
      <button class="submit" id="submit">提交委托</button>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
    </section>
    <div class="bottom">行情数据更新于 10:32:18</div>
  </div>
  <script type="module" src="/src/order.js"></script>
</body>
</html>
